<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus • Sign in</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 30%,#223f3044,transparent 65%),#0c1015;color:#e9eef2;font:15px Segoe UI,sans-serif}.card{width:min(420px,90vw);padding:38px;border:1px solid #304137;background:#131c20;border-radius:18px;box-shadow:20px 30px 80px #0005}h1{font-size:32px}h1 span{color:#b9f576}p{color:#8c9ca8;line-height:1.6}input,button{width:100%;padding:13px;margin:9px 0 18px;border:1px solid #35454a;border-radius:8px;background:#0e161c;color:white;font:inherit}button{background:#b9f576;color:#132113;font-weight:600;cursor:pointer}.error{color:#ffacac}</style><div class="card"><h1><span>◈</span> nexus.</h1><h2>Your fleet. In focus.</h2><p>Sign in to your private IT inventory workspace.</p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" value="itsupport@kmdcomputer.com" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in →</button></form><p id="error" class="error" role="alert"></p><p style="font-size:12px">Managed accounts · Server-enforced permissions</p></div><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let d=await r.json();if(!r.ok)throw Error(d.error);location.href='/'}catch(x){document.getElementById('error').textContent=x.message}finally{b.disabled=false}};</script></html>
